[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s2tpo"
version = "0.1.0"
description = "Session-to-Token Policy Optimization for long-term generative recommendation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
  "torch>=2.1",
  "transformers>=4.40",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["s2tpo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
